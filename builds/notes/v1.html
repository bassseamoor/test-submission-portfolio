<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Notes</title>
<style>
  :root{--bg:#101613;--card:#182019;--line:#2a352c;--txt:#dce8de;--muted:#8fa096;--accent:#7fd6a4;--warn:#e58bb1}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);font:16px/1.5 system-ui,-apple-system,sans-serif;-webkit-text-size-adjust:100%}
  #app{max-width:720px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
  header.top{position:sticky;top:0;background:var(--bg);z-index:5;display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
  header.top h1{margin:0;font-size:20px;flex:1}
  .btn{background:var(--card);color:var(--txt);border:1px solid var(--line);border-radius:10px;padding:10px 16px;font-size:15px;cursor:pointer;min-height:44px}
  .btn:active{transform:scale(.97)}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#0c120e;font-weight:700}
  .btn.danger{color:#ff9d9d}
  #search{margin:12px 16px 4px;padding:12px 14px;font-size:16px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--txt);width:calc(100% - 32px)}
  #list{padding:8px 16px 40px;display:flex;flex-direction:column;gap:8px}
  .row{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;min-height:64px;text-align:left;width:100%;color:var(--txt);font-size:16px}
  .row .tt{flex:1;min-width:0}
  .row .tt b{display:block;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .row .tt small{display:block;color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .row.scratch{border-color:var(--accent);background:#16241b}
  .row .iconbtn{background:none;border:none;font-size:18px;cursor:pointer;padding:8px;min-width:44px;min-height:44px;color:var(--muted)}
  .row .iconbtn.on{color:var(--accent)}
  .empty{color:var(--muted);text-align:center;padding:40px 20px}
  /* editor */
  #editorView{display:flex;flex-direction:column;min-height:100vh}
  #editorView[hidden]{display:none}
  #listView[hidden]{display:none}
  header.ed{display:flex;align-items:center;gap:8px;padding:12px 12px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:5}
  #titleInput{flex:1;background:none;border:none;color:var(--txt);font-size:18px;font-weight:700;padding:10px 4px;min-width:0}
  #titleInput:focus{outline:none}
  #scratchLabel{flex:1;font-size:18px;font-weight:700;padding:10px 4px;color:var(--accent)}
  #metaLine{padding:8px 16px;color:var(--muted);font-size:13px}
  #edActions{display:flex;gap:8px;padding:0 16px 8px;flex-wrap:wrap}
  #edActions .btn{min-height:40px;padding:8px 12px;font-size:14px}
  #editor{flex:1;margin:0 16px 16px;background:var(--card);border:1px solid var(--line);border-radius:12px;color:var(--txt);font:16px/1.6 system-ui,sans-serif;padding:14px;min-height:50vh;resize:vertical}
  #editor:focus{outline:1px solid var(--accent)}
  /* toast */
  #toast{position:fixed;left:50%;transform:translateX(-50%);bottom:24px;background:#232d24;border:1px solid var(--line);color:var(--txt);border-radius:12px;padding:12px 16px;display:flex;gap:14px;align-items:center;z-index:50;box-shadow:0 4px 20px rgba(0,0,0,.5);font-size:15px;max-width:calc(100vw - 32px)}
  #toast[hidden]{display:none}
  #toast button{background:var(--accent);border:none;border-radius:8px;color:#0c120e;font-weight:700;padding:8px 14px;font-size:14px;cursor:pointer;min-height:40px}
</style>
</head>
<body>
<div id="app">
  <div id="listView">
    <header class="top"><h1>Notes</h1><button class="btn primary" id="newBtn">+ New</button></header>
    <input id="search" type="search" placeholder="Search notes" autocomplete="off">
    <div id="list"></div>
  </div>
  <div id="editorView" hidden>
    <header class="ed">
      <button class="btn" id="backBtn">&#8249; Back</button>
      <input id="titleInput" placeholder="Title" maxlength="120">
      <span id="scratchLabel" hidden>Scratch</span>
    </header>
    <div id="metaLine">0 word(s)</div>
    <div id="edActions">
      <button class="btn" id="pinBtn">Pin</button>
      <button class="btn" id="exportBtn">Export .md</button>
      <button class="btn danger" id="delBtn">Delete</button>
    </div>
    <textarea id="editor" placeholder="Start typing&#8230;"></textarea>
  </div>
</div>
<div id="toast" hidden><span id="toastMsg"></span><button id="toastUndo">Undo</button></div>
<script>
(function(){
'use strict';
var SCRATCH_KEY='moor.notes.v1', APP_KEY='moor.notes.app.v1', SAVE_MS=300, UNDO_MS=5000;
/* storage shim: on opaque origins (some blob:/sandboxed contexts) localStorage
   throws on access. Fall back to memory so the app never crashes; persistence
   simply lasts for the session there. */
var memStore={};
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return (k in memStore)?memStore[k]:null}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){memStore[k]=String(v)}}
function lsDel(k){try{localStorage.removeItem(k)}catch(e){delete memStore[k]}}
function $(s){return document.querySelector(s)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function uid(){return 'n'+Date.now().toString(36)+Math.floor(Math.random()*46656).toString(36)}
function words(t){t=String(t||'').trim();return t?t.split(/\s+/).length:0}
function rel(ts){var d=Date.now()-ts;if(d<45000)return 'just now';var m=Math.floor(d/60000);if(m<60)return m+'m ago';var h=Math.floor(m/60);if(h<24)return h+'h ago';return Math.floor(h/24)+'d ago'}
function snippet(t){t=String(t||'').replace(/\s+/g,' ').trim();return t.length>70?t.slice(0,70)+'\u2026':t}
function slug(s){return String(s||'note').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,40)||'note'}
function dayStr(ts){var d=new Date(ts);function p(n){return (n<10?'0':'')+n}return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())}
function firstLine(t){var l=String(t||'').split('\n')[0].trim();return l||'Untitled note'}

/* storage */
function loadApp(){try{var d=JSON.parse(lsGet(APP_KEY)||'null');if(d&&d.notes&&typeof d.notes==='object')return d}catch(e){}return {notes:{}}}
function saveApp(d){try{lsSet(APP_KEY,JSON.stringify(d))}catch(e){}}
function getScratch(){var v=lsGet(SCRATCH_KEY);return v==null?'':v}
function setScratch(t){lsSet(SCRATCH_KEY,t)}

var store=loadApp().notes;
/* purge deletions that expired while the app was closed */
(function(){var changed=false;Object.keys(store).forEach(function(id){if(store[id]&&store[id]._deleted){delete store[id];changed=true}});if(changed)saveApp({notes:store})})();

var editing=null, titleDirty=false, saveTimer=null, toastTimer=null, query='';

var listView=$('#listView'), editorView=$('#editorView'), listEl=$('#list'),
    searchEl=$('#search'), editor=$('#editor'), titleInput=$('#titleInput'),
    scratchLabel=$('#scratchLabel'), metaLine=$('#metaLine'),
    pinBtn=$('#pinBtn'), exportBtn=$('#exportBtn'), delBtn=$('#delBtn'),
    toastEl=$('#toast'), toastUndo=$('#toastUndo');

function updateMeta(saved){
  var n=words(editor.value);
  metaLine.textContent=n+' word(s)'+(saved?' \u00b7 saved':'');
}
function saveNow(){
  if(!editing)return;
  var t=editor.value;
  if(editing.kind==='scratch'){ setScratch(t); }
  else{
    var n=store[editing.id];if(!n)return;
    n.body=t;
    if(!titleDirty)n.title=firstLine(t);
    n.updatedAt=Date.now();
    saveApp({notes:store});
  }
  updateMeta(true);
}
function scheduleSave(){
  clearTimeout(saveTimer);
  updateMeta(false);
  saveTimer=setTimeout(saveNow,SAVE_MS);
}

function sortedNotes(){
  return Object.keys(store).map(function(id){return store[id]})
    .filter(function(n){return n&&!n._deleted})
    .sort(function(a,b){
      if(!!a.pinned!==!!b.pinned)return a.pinned?-1:1;
      return (b.updatedAt||0)-(a.updatedAt||0)||String(b.createdAt||'').localeCompare(String(a.createdAt||''));
    });
}
function renderList(){
  listEl.innerHTML='';
  var q=query.trim().toLowerCase();
  /* scratch row: always first, never deletable */
  var s=getScratch();
  var sr=document.createElement('button');
  sr.className='row scratch';sr.id='scratchRow';
  sr.innerHTML='<div class="tt"><b>\u270e Scratch</b><small>'+esc(snippet(s)||'Quick capture \u2014 tap to type')+'</small></div>';
  sr.addEventListener('click',function(){openEditor('scratch',null)});
  listEl.appendChild(sr);
  var notes=sortedNotes().filter(function(n){
    if(!q)return true;
    return (n.title+'\n'+n.body).toLowerCase().indexOf(q)>=0;
  });
  if(!notes.length&&!q){
    var em=document.createElement('div');em.className='empty';em.textContent='No notes yet. Tap + New to start one.';listEl.appendChild(em);return;
  }
  if(!notes.length){
    var em2=document.createElement('div');em2.className='empty';em2.textContent='Nothing matches.';listEl.appendChild(em2);return;
  }
  notes.forEach(function(n){
    var r=document.createElement('button');
    r.className='row';r.dataset.id=n.id;
    r.innerHTML='<div class="tt"><b>'+esc(n.title||'Untitled note')+'</b><small>'+esc(snippet(n.body))+' \u00b7 '+esc(rel(n.updatedAt||n.createdAt||Date.now()))+'</small></div>'+
      '<span class="iconbtn pin '+(n.pinned?'on':'')+'" role="button" tabindex="0" aria-label="pin">'+(n.pinned?'\uD83D\uDCCC':'\u25CB')+'</span>'+
      '<span class="iconbtn del" role="button" tabindex="0" aria-label="delete">\u2715</span>';
    r.addEventListener('click',function(){openEditor('note',n.id)});
    var pb=r.querySelector('.pin'), db=r.querySelector('.del');
    function stop(e){e.stopPropagation()}
    pb.addEventListener('click',function(e){stop(e);n.pinned=!n.pinned;n.updatedAt=Date.now();saveApp({notes:store});renderList()});
    pb.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();e.stopPropagation();n.pinned=!n.pinned;n.updatedAt=Date.now();saveApp({notes:store});renderList()}});
    db.addEventListener('click',function(e){stop(e);doDelete(n.id)});
    db.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();e.stopPropagation();doDelete(n.id)}});
    listEl.appendChild(r);
  });
}

function openEditor(kind,id){
  editing={kind:kind,id:id};titleDirty=false;
  clearTimeout(saveTimer);
  var isScratch=kind==='scratch';
  titleInput.hidden=isScratch;scratchLabel.hidden=!isScratch;
  pinBtn.style.display=isScratch?'none':'';
  delBtn.style.display=isScratch?'none':'';
  var n=isScratch?null:store[id];
  if(!n&&!isScratch)return;
  titleInput.value=isScratch?'':(n.title||'');
  editor.value=isScratch?getScratch():(n.body||'');
  pinBtn.textContent=(n&&n.pinned)?'Unpin':'Pin';
  listView.hidden=true;editorView.hidden=false;
  updateMeta(true);
  editor.focus();
  try{editor.setSelectionRange(editor.value.length,editor.value.length)}catch(e){}
}
function closeEditor(){
  clearTimeout(saveTimer);saveNow();
  editing=null;editorView.hidden=true;listView.hidden=false;
  renderList();searchEl.focus();
}

function doDelete(id){
  var n=store[id];if(!n||n._deleted)return;
  n._deleted=true;n._deletedAt=Date.now();saveApp({notes:store});
  if(editing&&editing.kind==='note'&&editing.id===id){editing=null;editorView.hidden=true;listView.hidden=false}
  renderList();
  $('#toastMsg').textContent='Deleted \u2014 ';
  toastEl.hidden=false;
  clearTimeout(toastTimer);
  toastTimer=setTimeout(function(){expireDelete(id)},UNDO_MS);
  toastUndo.onclick=function(){undoDelete(id)};
}
function undoDelete(id){
  var n=store[id];
  clearTimeout(toastTimer);toastEl.hidden=true;
  if(n&&n._deleted){delete n._deleted;delete n._deletedAt;saveApp({notes:store})}
  renderList();
}
function expireDelete(id){
  toastEl.hidden=true;
  var n=store[id];
  if(n&&n._deleted){delete store[id];saveApp({notes:store})}
  renderList();
}

function doExport(){
  var name, body;
  if(editing&&editing.kind==='scratch'){name='scratch';body=editor.value}
  else if(editing&&editing.id&&store[editing.id]){var n=store[editing.id];name=n.title||'note';body=n.body||''}
  else return;
  var fname=dayStr(Date.now())+'_'+slug(name)+'.md';
  var blob=new Blob([body],{type:'text/markdown'});
  var a=document.createElement('a');
  a.href=URL.createObjectURL(blob);a.download=fname;
  document.body.appendChild(a);a.click();
  setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},1000);
}

$('#newBtn').addEventListener('click',function(){
  var id=uid(),now=Date.now();
  store[id]={id:id,title:'Untitled note',body:'',pinned:false,createdAt:now,updatedAt:now};
  saveApp({notes:store});
  openEditor('note',id);
});
$('#backBtn').addEventListener('click',closeEditor);
searchEl.addEventListener('input',function(){query=searchEl.value;renderList()});
editor.addEventListener('input',scheduleSave);
titleInput.addEventListener('input',function(){
  if(!editing||editing.kind!=='note')return;
  var n=store[editing.id];if(!n)return;
  titleDirty=titleInput.value.trim()!=='';
  n.title=titleInput.value;n.updatedAt=Date.now();saveApp({notes:store});
});
pinBtn.addEventListener('click',function(){
  if(!editing||editing.kind!=='note')return;
  var n=store[editing.id];if(!n)return;
  n.pinned=!n.pinned;n.updatedAt=Date.now();saveApp({notes:store});
  pinBtn.textContent=n.pinned?'Unpin':'Pin';
});
exportBtn.addEventListener('click',doExport);
delBtn.addEventListener('click',function(){if(editing&&editing.kind==='note')doDelete(editing.id)});
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'&&!editorView.hidden)closeEditor();
});

renderList();
})();
</script>
</body>
</html>
